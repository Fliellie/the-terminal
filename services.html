<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>the terminal</title>
  <style>
    :root {
      --bg: #030405;
      --container-bg: #070908;
      --green: #00ff77;
      --green-glow: rgba(0, 255, 119, 0.45);
      --green-subtle: rgba(0, 255, 119, 0.08);
      --green-border: rgba(0, 255, 119, 0.85);
      --font-game: "Fira Code", "JetBrains Mono", "Courier New", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--green);
      font-family: var(--font-game);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      user-select: none;
    }

    /* Ambient CRT Scanline Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 99;
      opacity: 0.65;
    }

    /* Subtle background grid */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.9) 100%),
        linear-gradient(rgba(0, 255, 119, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 119, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Return Button */
    .top-nav {
      width: 100%;
      max-width: 980px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
    }

    .audio-badge {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--green);
      border: 1px solid var(--green);
      padding: 5px 12px;
      border-radius: 4px;
      background: rgba(0, 255, 119, 0.06);
      cursor: pointer;
      transition: all 0.2s;
    }

    .audio-badge:hover {
      background: var(--green);
      color: #000;
      box-shadow: 0 0 12px var(--green-glow);
    }

    .btn-esc {
      color: var(--green);
      text-decoration: none;
      font-size: 0.78rem;
      border: 1px solid var(--green-border);
      padding: 6px 14px;
      border-radius: 6px;
      background: rgba(0, 255, 119, 0.05);
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .btn-esc:hover {
      background: var(--green);
      color: #000;
      box-shadow: 0 0 15px var(--green-glow);
    }

    /* Main Container: Green-Bordered with rounded corners */
    .terminal-container {
      position: relative;
      width: 100%;
      max-width: 980px;
      background: var(--container-bg);
      border: 1.5px solid var(--green);
      border-radius: 20px;
      box-shadow: 
        0 0 30px rgba(0, 255, 119, 0.15),
        inset 0 0 35px rgba(0, 255, 119, 0.03);
      padding: 36px 40px 40px;
      display: flex;
      flex-direction: column;
      z-index: 2;
    }

    /* Top-left label inside the container: 'the terminal' */
    .terminal-title-label {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--green);
      letter-spacing: 1.5px;
      margin-bottom: 30px;
      text-shadow: 0 0 8px rgba(0, 255, 119, 0.5);
    }

    /* Scrollable Cards Wrapper with Right-side Scroll Indicator */
    .scroll-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    /* Vertically Scrollable List of Cards */
    .cards-scroll-container {
      width: 100%;
      max-height: 440px;
      overflow-y: auto;
      padding: 12px 28px 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    /* Custom Green Scrollbar */
    .cards-scroll-container::-webkit-scrollbar {
      width: 6px;
    }
    .cards-scroll-container::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 3px;
    }
    .cards-scroll-container::-webkit-scrollbar-thumb {
      background: var(--green);
      border-radius: 3px;
      box-shadow: 0 0 8px var(--green);
    }

    /* Card Item (All cards share the exact same style) */
    .card-link {
      position: relative;
      width: 100%;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      color: inherit;
      outline: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    /* SVG Border Layer inside each card */
    .card-svg-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Normal state: standard rectangular green outline */
    .poly-normal {
      fill: rgba(5, 10, 8, 0.88);
      stroke: var(--green);
      stroke-width: 1.5px;
      opacity: 1;
      transition: opacity 0.2s ease, fill 0.2s ease;
    }

    /* Hover state: slanted left edge ('cạnh trái bị cắt xén') */
    .poly-hover {
      fill: rgba(0, 255, 119, 0.12);
      stroke: #66ffaa;
      stroke-width: 2px;
      opacity: 0;
      transition: opacity 0.2s ease, fill 0.2s ease;
    }

    /* Text inside card */
    .card-content {
      position: relative;
      z-index: 1;
      font-size: clamp(1.2rem, 2.4vw, 1.6rem);
      font-weight: 600;
      color: var(--green);
      letter-spacing: 2px;
      transition: all 0.2s ease;
      text-shadow: 0 0 6px rgba(0, 255, 119, 0.4);
    }

    /* HOVER EFFECT:
       1. Left edge is cut/slanted (poly-hover visible)
       2. Card scales up / gets bigger ('hover to lên')
       3. Green glow intensifies
    */
    .card-link:hover {
      transform: scale(1.035);
      z-index: 10;
      filter: drop-shadow(0 6px 20px rgba(0, 255, 119, 0.45));
    }

    .card-link:hover .poly-normal {
      opacity: 0;
    }

    .card-link:hover .poly-hover {
      opacity: 1;
    }

    .card-link:hover .card-content {
      color: #ffffff;
      text-shadow: 
        0 0 10px var(--green),
        0 0 22px rgba(0, 255, 119, 0.85);
      letter-spacing: 2.5px;
    }

    /* Right-side scroll arrows (as depicted in the drawing with ↑ and ↓) */
    .scroll-indicator {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--green);
      opacity: 0.8;
      pointer-events: none;
    }

    .scroll-arrow {
      font-size: 1.3rem;
      line-height: 1;
      animation: floatArrow 2s infinite ease-in-out;
      text-shadow: 0 0 8px var(--green);
    }

    .scroll-arrow.down {
      animation: floatArrowDown 2s infinite ease-in-out;
      animation-delay: 1s;
    }

    .scroll-line {
      width: 1.5px;
      height: 90px;
      background: linear-gradient(
        to bottom,
        var(--green),
        transparent 50%,
        var(--green)
      );
      box-shadow: 0 0 6px var(--green);
    }

    @keyframes floatArrow {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(-4px); opacity: 1; }
    }

    @keyframes floatArrowDown {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(4px); opacity: 1; }
    }

    /* Bottom subtle game hint */
    .terminal-footer-hint {
      text-align: center;
      margin-top: 26px;
      font-size: 0.75rem;
      color: rgba(0, 255, 119, 0.5);
      letter-spacing: 1.5px;
    }
  </style>

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Continuously unlock on user interaction
    ['click', 'pointerdown', 'mousedown', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, () => {
        initAudio();
      });
    });

    function playHoverBlip() {
      initAudio();

      if (audioCtx && audioCtx.state === 'running') {
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(1150, now + 0.05);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
          return;
        } catch(e) {}
      }

      // Fallback
      try {
        const snd = new Audio(BLIP_SOUND_B64);
        snd.volume = 0.25;
        snd.play().catch(() => {});
      } catch(e) {}
    }

    function forceUnlockAndTest() {
      initAudio();
      playHoverBlip();
      const badge = document.getElementById('audioStatusBadge');
      if (badge) badge.textContent = '[ 🔊 SOUND: TEST OK ]';
    }

    const playBeep = playHoverBlip;

    // Attach hover sound to all cards
    document.querySelectorAll('.card-link').forEach(card => {
      card.addEventListener('mouseenter', () => {
        playHoverBlip();
      });
      card.addEventListener('click', () => {
        playHoverBlip();
      });
    });
  </script>
